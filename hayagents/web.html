<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hay Export Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paddock:#E9ECE3; --paper:#FBFCF8; --gum:#1E2B24; --muted:#5C6B61; --line:#D5DBCF;
          --hay:#E0A82E; --hay-pale:#F7E7BC; --dam:#2F6B8A; --dam-pale:#DCEAF1; --sage:#6E8B5E; --sage-pale:#E2EADB;
          --berry:#A3263A; --berry-pale:#F6DDE1; --display:"Bricolage Grotesque", system-ui, sans-serif;
          --body:Figtree, system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 var(--body); color:var(--gum); background:var(--paddock); }
  :focus-visible { outline:2px solid var(--dam); outline-offset:2px; }
  h1, h2 { font-family:var(--display); font-weight:700; letter-spacing:-.01em; margin:0; }
  .muted { color:var(--muted); }

  /* header and workspace popover */
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px clamp(16px,4vw,48px);
         border-bottom:1px solid var(--line); background:var(--paper); }
  .brand { display:flex; align-items:center; gap:10px; font:700 20px var(--display); white-space:nowrap; }
  .brand svg { width:30px; }
  .top .workspace-toggle { display:grid; place-items:center; width:44px; height:44px; padding:0;
                           background:var(--paddock); color:var(--gum); }
  .workspace-toggle:hover { box-shadow:inset 0 0 0 1px var(--sage); }
  .workspace-toggle svg { width:22px; }
  .workspace { position:fixed; inset:76px clamp(12px,4vw,48px) auto auto; margin:0;
               width:min(380px,calc(100% - 24px)); max-height:calc(100dvh - 88px); overflow:auto;
               color:var(--gum); box-shadow:0 16px 52px rgba(30,43,36,.16); }
  .workspace h2 { font-size:17px; }
  .team { display:grid; gap:12px; padding:14px 0 18px; }
  .member { display:flex; align-items:center; gap:10px; }
  .member b { display:block; font-weight:600; font-size:14px; line-height:1.2; }
  .member small { color:var(--muted); font-size:12px; }
  .member > .effort { margin-left:auto; flex:none; }
  .member.active small { color:var(--gum); font-weight:600; }

  /* the agents' figures */
  .fig { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; flex:none; position:relative; }
  .fig svg { width:86%; }
  .fig.lg { width:76px; height:76px; border-radius:22px; }
  .fig.task-avatar { width:32px; height:32px; border-radius:9px; }
  .fig.activity-avatar { width:19px; height:19px; border-radius:5px; }
  .ceo_agent { background:var(--gum); } .production_agent { background:var(--hay); }
  .procurement_agent { background:var(--dam); } .coordinator { background:var(--sage); }
  .active .fig::after { content:""; position:absolute; inset:-4px; border-radius:inherit; border:2px solid var(--hay);
                        animation:ring 1.4s ease-out infinite; }
  @keyframes ring { from { transform:scale(.85); opacity:1; } to { transform:scale(1.2); opacity:0; } }

  /* page */
  .layout { padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px) 120px; }
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .history p { margin:0 0 10px; padding-left:12px; border-left:2px solid var(--line); font-size:13px; }

  /* the company data, live */
  .data { border-top:1px solid var(--line); }
  .data summary { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px;
                  list-style:none; cursor:pointer; font:700 15px var(--display); }
  .data summary::-webkit-details-marker { display:none; }
  .data summary::after { content:""; width:8px; height:8px; margin-right:3px; border-right:2px solid var(--muted);
                         border-bottom:2px solid var(--muted); transform:rotate(45deg); }
  .data[open] summary::after { transform:rotate(225deg); }
  .data[open] > div { padding-bottom:14px; }
  .lot { display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; align-items:center; padding:10px 0;
         border-top:1px solid var(--line); font-size:13px; }
  .lot:first-of-type { border-top:none; }
  .lot svg { width:28px; grid-row:span 2; }
  .lot b { font-size:14px; }
  .lot .tonnes { font:600 14px var(--display); }
  .lot .wet { color:var(--berry); }
  .lot .note { grid-column:2 / 4; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lot.changed { animation:flash 1.6s ease; }
  @keyframes flash { 0%, 40% { background:var(--hay-pale); } 100% { background:transparent; } }
  .in_stock { background:var(--paddock); color:var(--muted); } .reserved { background:var(--hay-pale); color:#7A5410; }
  .ordered { background:var(--dam-pale); color:var(--dam); }
  .mail { padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
  .mail:first-of-type { border-top:none; }
  .mail p { margin:2px 0 0; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* the CEO agent's desk */
  .desk { display:flex; gap:clamp(12px,2vw,22px); align-items:flex-start; max-width:860px; margin:12px auto 0; }
  .desk-copy { flex:1; min-width:0; overflow-wrap:anywhere; }
  .desk h1 { font-size:clamp(24px,3.5vw,38px); line-height:1.2; }
  .desk .instruction { font-size:clamp(18px,2.4vw,28px); }
  .ask { margin-top:6px; max-width:62ch; }
  .examples { margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; }
  .examples button { background:var(--sage-pale); color:var(--gum); border:1px solid transparent; font-size:13px; padding:7px 12px; }
  .examples button:hover { border-color:var(--sage); }
  .reply { margin-top:18px; white-space:pre-wrap; max-width:72ch; }

  /* tool calls, shown as they happen */
  .calls { margin-top:14px; display:flex; flex-direction:column; gap:2px; font:13px/1.5 var(--mono); }
  .call summary { list-style:none; cursor:pointer; display:flex; gap:6px; align-items:center; padding:3px 0; }
  .call summary::-webkit-details-marker { display:none; }
  .call .mark { color:var(--sage); width:1ch; flex:none; }
  .call .name { flex:none; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .call .actor { display:inline-flex; align-items:center; gap:4px; flex:none; font:600 11px/1.2 var(--body); color:var(--muted); }
  .call .args { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .call .out { margin:0 0 6px 2ch; padding-left:10px; border-left:1px solid var(--line); color:var(--muted);
               white-space:pre-wrap; overflow-wrap:anywhere; max-height:180px; overflow:auto; }
  .brief { margin:0 0 6px 2ch; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brief::before { content:"\2514  "; }
  .call[open] + .brief { display:none; }
  .call.warn .mark, .call.warn + .brief { color:var(--berry); }
  .call.new { animation:enter .35s ease both; }
  .thinking { display:flex; align-items:center; gap:10px; margin-top:14px; color:var(--muted); font-size:14px; }
  .spin { width:14px; height:14px; flex:none; border-radius:50%; border:2px solid var(--hay-pale); border-top-color:var(--hay); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes enter { from { opacity:0; transform:translateY(4px); } }

  /* the plan */
  .plan { margin:32px auto 0; }
  .plan h2 { font-size:21px; text-align:center; }
  .plan .lanes { margin-top:14px; align-items:stretch; }
  .step { display:flex; flex-direction:column; }
  .step header .goal { grid-column:1 / -1; min-height:2.7em; }
  .lane .plan-details { display:grid; gap:10px; padding:14px 18px 16px; }
  .step .plan-details { flex:1; grid-template-rows:1fr auto; }
  .plan-details .meta { display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
  .plan-details .icon { margin-top:2px; color:var(--sage); }
  .icon { width:15px; height:15px; flex:none; }
  .task-agents { display:flex; flex-wrap:wrap; align-items:center; gap:6px; list-style:none; margin:0; padding:0; }
  .task-agent { display:flex; align-items:center; gap:6px; min-width:0; padding:2px 9px 2px 2px;
                border-radius:11px; background:var(--paddock); color:var(--gum); font-size:12px; font-weight:600;
                overflow-wrap:anywhere; }
  .task-agent.on-turn { background:var(--dam-pale); box-shadow:inset 0 0 0 1px var(--dam); }
  .task-agent-copy { display:grid; gap:2px; line-height:1.15; }
  .effort { display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:11px; font-weight:500; }
  .model { display:block; color:var(--muted); font:400 11px var(--mono); }
  .effort-meter { display:inline-flex; align-items:flex-end; gap:2px; color:var(--dam); }
  .effort-meter i { width:3px; height:8px; border-radius:1px; background:currentColor; opacity:.22; }
  .effort-meter i:first-child { height:4px; opacity:1; }
  .effort-meter i:nth-child(2) { height:6px; }
  .effort-meter.medium i:nth-child(2), .effort-meter.high i { opacity:1; }
  .approval-error { padding-top:12px; color:var(--muted); }

  /* the bar */
  .bar { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); width:min(760px, calc(100% - 40px));
         display:flex; gap:8px; padding:8px; background:var(--paper); border:1px solid var(--line); border-radius:16px;
         box-shadow:0 14px 40px rgba(30,43,36,.12); view-transition-name:workflow-bar; }
  .bar[hidden] { display:none; }
  .bar input { flex:1; min-width:0; border:none; outline:none; font:inherit; padding:10px 12px; background:transparent; color:var(--gum); }
  button { font:500 15px var(--body); border:none; border-radius:11px; padding:10px 18px; cursor:pointer; }
  .send { background:var(--gum); color:var(--paper); } .approve { background:var(--hay); color:var(--gum); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }

  /* working: one lane per task */
  .workflow-summary { display:grid; gap:12px; max-width:960px; margin:0 auto; view-transition-name:workflow-bar; }
  .work-status { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .work-status h1 { font-size:20px; }
  .work-status .counter { margin-left:auto; font-size:13px; }
  .work-status .usage { margin:0; font-size:13px; }
  .task-progress { display:flex; gap:5px; }
  .task-progress span { flex:1; height:8px; border-radius:99px; background:var(--paddock); transition:background-color .3s ease; }
  .task-progress .done { background:var(--sage); }
  .task-progress .active { background:var(--dam); }
  .task-progress .blocked { background:var(--berry); }
  .lanes { display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:18px; margin:24px auto 0; max-width:1440px; }
  .lane { flex:1 1 300px; min-width:0; max-width:450px; overflow:hidden; padding:0; }
  @keyframes pop { from { opacity:0; transform:translateY(16px) scale(.96); } }
  .lane header { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 12px; padding:16px 18px;
                 align-items:start; border-bottom:1px solid var(--line); }
  .lane header:last-child { border-bottom:0; }
  .lane header .goal { margin:0; font:700 16px/1.35 var(--display); overflow-wrap:anywhere; }
  .lane header .task-number { font-size:12px; color:var(--muted); margin-bottom:3px; }
  .lane .task-agents { grid-column:1 / -1; }
  .waiting { display:flex; align-items:center; gap:7px; font-family:var(--body); }
  .turn { display:flex; align-items:center; grid-column:1 / -1; gap:7px; margin:0; color:var(--dam); font-size:13px; font-weight:600; }
  .lane .feed { padding:10px 18px 16px; max-height:380px; overflow-y:auto; }
  .lane .feed .calls { margin-top:0; }
  .note { display:flex; gap:10px; margin:10px 0 4px; font-size:14px; }
  .note p { margin:0; padding:8px 12px; background:var(--paddock); border-radius:10px; }
  .badge { margin-left:auto; flex:none; font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px; }
  .icon-badge { display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }
  .icon-badge .icon { width:13px; height:13px; }
  .open { background:var(--hay-pale); color:#7A5410; } .done { background:var(--sage-pale); color:#3E5532; }
  .badge.active { background:var(--dam-pale); color:var(--dam); }
  .blocked { background:var(--berry-pale); color:var(--berry); }

  /* done */
  .completion-summary { padding:8px 0 0; }
  .completion-summary .work-status h1 { font-size:clamp(24px,3vw,34px); line-height:1.15; }
  .completion-summary:has(.seal.success) { text-align:center; }
  .completion-summary:has(.seal.success) .work-status { flex-direction:column; gap:12px; }
  .seal { width:54px; height:54px; flex:none; border-radius:50%; display:grid; place-items:center;
          animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both; }
  .seal .icon { width:28px; height:28px; stroke-width:2.5; }
  .seal.success { width:96px; height:96px; background:var(--hay); color:var(--gum); }
  .seal.success .icon { width:46px; height:46px; stroke-width:3.5; stroke-linecap:butt; stroke-linejoin:miter;
                        stroke-dasharray:60; stroke-dashoffset:60; animation:draw .5s .35s ease forwards; }
  .seal.attention { background:var(--hay-pale); color:#7A5410; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .results { align-items:stretch; }
  .result { display:flex; flex-direction:column; }
  .result header .result-title { margin:0 0 6px; font-size:22px; line-height:1.2; }
  .result header .goal { min-height:2.8em; color:var(--muted); font:600 15px/1.4 var(--body); }
  .result .feed { display:grid; gap:12px; padding:14px 18px 16px; max-height:none; overflow-wrap:anywhere; white-space:pre-line; }
  .result .feed p { margin:0; }
  .result-alert { display:flex; align-items:flex-start; gap:8px; padding:10px 12px; border-radius:9px;
                  background:var(--paddock); font-size:14px; }
  .result-alert strong { display:block; font-size:13px; }
  .result-alert .icon { margin-top:3px; color:var(--muted); }
  .follow-up { justify-self:start; min-height:44px; border:1px solid var(--line); background:var(--paper);
               color:var(--gum); font-weight:600; }
  .follow-up:hover { border-color:var(--sage); background:var(--sage-pale); }
  .completion-footer { display:flex; justify-content:center; margin:22px auto 0; }

  /* Shared elements travel between the plan, work, and results layouts. */
  .lane { view-transition-class:task-card; }
  ::view-transition { pointer-events:none; }
  ::view-transition-group(*) { animation-duration:.95s; animation-timing-function:cubic-bezier(.22,.75,.25,1); }
  ::view-transition-group(root) { animation-duration:.24s; }
  ::view-transition-group(workflow-bar) { z-index:1; }
  ::view-transition-old(.task-card), ::view-transition-old(workflow-bar) {
    animation:shared-out .95s linear both; mix-blend-mode:normal;
  }
  ::view-transition-new(.task-card), ::view-transition-new(workflow-bar) {
    animation:shared-in .95s linear both; mix-blend-mode:normal;
  }
  @keyframes shared-out { 0%, 16% { opacity:1; } 38%, 100% { opacity:0; } }
  @keyframes shared-in { 0%, 16% { opacity:0; } 38%, 100% { opacity:1; } }

  @media (max-width:540px) {
    .desk .fig.lg { width:50px; height:50px; border-radius:15px; }
    .workspace { padding:16px; }
    .bar button { padding-inline:12px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .seal.success svg { stroke-dashoffset:0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 48 48"><rect x="7" y="13" width="34" height="22" rx="3" fill="#F7E7BC" stroke="#1E2B24" stroke-width="2.5"/><path d="M18 13v22M30 13v22" stroke="#1E2B24" stroke-width="2.5"/></svg>Hay Export Agents</div>
  <button type="button" class="workspace-toggle" popovertarget="workspace" aria-label="Workspace details" title="Workspace details">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M13 4v16m3-11h2m-2 3h2m-2 3h2" stroke-linecap="round"/>
    </svg>
  </button>
</header>
<aside class="panel workspace" id="workspace" popover aria-label="Workspace details">
  <h2>Available agents</h2>
  <div class="team" id="team"></div>
  <details class="data"><summary>Shed stock</summary><div id="stock"></div></details>
  <details class="data"><summary>Grower inbox</summary><div id="inbox"></div></details>
  <details class="data"><summary>Earlier instructions</summary><div class="history" id="history"></div></details>
</aside>
<main class="layout" id="stage"></main>
<form class="bar" id="bar">
  <button type="button" class="approve" id="approve" hidden>Approve plan</button>
  <input id="input" placeholder="Tell the CEO agent what needs doing" autocomplete="off" aria-label="Instruction">
  <button class="send" id="send" aria-label="Send">&uarr;</button>
</form>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

const ROBOT = `<g stroke="#1E2B24" stroke-width="1.8" fill="#FBFCF8">
  <rect x="18" y="39" width="28" height="16" rx="6"/><path d="M24 56h16" stroke-linecap="round"/>
  <rect x="10" y="24" width="8" height="12" rx="3"/><rect x="46" y="24" width="8" height="12" rx="3"/>
  <rect x="15" y="17" width="34" height="26" rx="9"/><rect x="20" y="23" width="24" height="13" rx="5" fill="#1E2B24"/>
  <path d="M27 28v3m10-3v3" stroke="#F7E7BC" stroke-width="2.6" stroke-linecap="round"/></g>`;
const ROLE_MARKS = {
  ceo_agent: `<path d="m23 15-2-8 6 3 5-6 5 6 6-3-2 8Z" fill="#E0A82E" stroke="#1E2B24" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="m29 46 3-2 3 2-3 6Z" fill="#6E8B5E"/>`,
  production_agent: `<path d="M20 17v-3l5-5h14l5 5v3h4v4H16v-4z" fill="#F7E7BC" stroke="#7A5410" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M22 17h20" stroke="#7A5410" stroke-width="1.5"/>
    <rect x="37" y="42" width="20" height="13" rx="2" fill="#F7E7BC" stroke="#7A5410" stroke-width="1.5"/>
    <path d="M43 43v11m8-11v11" stroke="#7A5410" stroke-width="1.5"/>`,
  procurement_agent: `<path d="M32 17V9" stroke="#F7E7BC" stroke-width="2"/><circle cx="32" cy="7" r="3" fill="#F7E7BC"/>
    <rect x="36" y="42" width="18" height="15" rx="2" fill="#F7E7BC" stroke="#7A5410" stroke-width="1.5"/>
    <path d="M45 43v6" stroke="#7A5410" stroke-width="1.8"/>`,
  coordinator: `<path d="M29 17V5" stroke="#1E2B24" stroke-width="2" stroke-linecap="round"/>
    <path d="M29 5h16l-4 4 4 4H29Z" fill="#F7E7BC" stroke="#1E2B24" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="m28 49 3 3 5-5" fill="none" stroke="#48633B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
};
const NAMES = {ceo_agent: "CEO", production_agent: "Production", procurement_agent: "Procurement", coordinator: "Coordinator"};
const JOBS = {ceo_agent: "Plans the work", production_agent: "Looks after the sheds", procurement_agent: "Buys from growers", coordinator: "Keeps tasks moving"};
const fig = (name, size = "") => {
  const role = Object.hasOwn(ROLE_MARKS, name) ? name : "";
  return `<span class="fig ${size} ${role}" aria-hidden="true"><svg viewBox="0 0 64 64">${ROBOT}${ROLE_MARKS[role] || ""}</svg></span>`;
};
const ICONS = {
  deadline: '<rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M8 3.5v4m8-4v4M3.5 10h17"/>',
  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12h.01"/>',
  open: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.5"/>',
  active: '<path d="M3 12h5l3-6 3 12 3-6h4"/>',
  done: '<path d="m5 12 4 4 10-9"/>',
  blocked: '<path d="M12 8v4m0 3.5h.01"/><circle cx="12" cy="12" r="8.5"/>',
};
const icon = name => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const agentIds = agents => (Array.isArray(agents) ? agents : (agents || "").split(",")).map(a => a.trim()).filter(Boolean);
const agentName = name => Object.hasOwn(NAMES, name) ? NAMES[name] : name;
const modelLabel = model => model ? `<small class="model">${esc(model)}</small>` : "";   // chosen by the CEO agent
function effortIndicator(level, isDefault = false) {
  if (!["low", "medium", "high"].includes(level)) return "";
  const label = isDefault ? `Default ${level}` : `${level[0].toUpperCase() + level.slice(1)} effort`;
  return `<small class="effort"><span class="effort-meter ${level}" aria-hidden="true"><i></i><i></i><i></i></span>${label}</small>`;
}
function taskAgents(agents, efforts = {}, active = [], models = {}) {
  const ids = [...new Set([...agentIds(agents), "coordinator"])];
  return `<ul class="task-agents" role="list" aria-label="Task agents">${ids.map(a =>
    `<li class="task-agent ${active.includes(a) ? "on-turn" : ""}">${fig(a, "task-avatar")}
      <div class="task-agent-copy"><span>${esc(agentName(a))}</span>${effortIndicator(efforts?.[a] ?? defaultEfforts[a])}${modelLabel(models?.[a] ?? defaultModels[a])}</div></li>`
  ).join("")}</ul>`;
}
const EXAMPLE = "Saigon Dairy Co. needs 500 t of Vietnam-spec oaten hay by 15 Dec. Also put any lot that's too wet for every export market on hold for re-drying.";

let instruction = "", proposedReply, seenCalls = new Set(), ceoTimer = null, defaultEfforts = {}, defaultModels = {};
const laneSnapshots = new WeakMap();

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`Request failed (${r.status})`);
  return r.json();
}
const getState = async () => (await fetch("/tasks")).json();

/* who is working right now */
function team(activeNames = [], status = {}) {
  $("team").innerHTML = Object.keys(NAMES).map(n => `<div class="member ${activeNames.includes(n) ? "active" : ""}">
    ${fig(n)}<div><b>${NAMES[n]}</b><small>${status[n] || (activeNames.includes(n) ? "On turn" : JOBS[n])}</small></div>
    ${effortIndicator(defaultEfforts[n], true)}</div>`).join("");
}

/* one tool call, the way Codex shows it: a line you can open for the result */
function args(json) {
  try { return Object.entries(JSON.parse(json)).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "); } catch { return ""; }
}
function brief(text) {
  if (text.startsWith("WARNING")) return "Prompt injection found: passed on as information only";
  if (text.startsWith("---")) return "Skill loaded";
  try { const r = JSON.parse(text).result ?? JSON.parse(text);
        return Array.isArray(r) ? `${r.length} rows` : typeof r === "string" ? r : Object.keys(r).length + " fields"; }
  catch { return text.split("\n")[0]; }
}
function call(c) {
  const key = c.rowid ?? `${c.actor}${c.tool}${c.args}${c.result}`, fresh = !seenCalls.has(key);
  seenCalls.add(key);
  const warn = c.result.startsWith("WARNING");
  const actor = c.actor ? `<span class="actor">${fig(c.actor, "activity-avatar")}${esc(agentName(c.actor))}</span>` : "";
  return `<details class="call ${warn ? "warn" : ""} ${fresh ? "new" : ""}" data-call-key="${esc(key)}">
    <summary>${actor}<span class="mark">${warn ? "!" : "&check;"}</span>
    <span class="name" title="${esc(c.tool)}">${esc(c.tool)}</span><span class="args">(${esc(args(c.args))})</span></summary>
    <div class="out">${esc(c.result)}</div></details><div class="brief">${esc(brief(c.result))}</div>`;
}

/* screens */
function desk(reply = "", plan = "") {
  $("stage").innerHTML = `<section class="desk">${fig("ceo_agent", "lg")}<div class="desk-copy">
    ${instruction ? `<h1 class="instruction">${esc(instruction)}</h1>` :
      `<h1>What needs doing?</h1><p class="ask muted">Give the CEO agent an instruction. It checks the stock and the inbox, plans the work, and waits for your approval before the team starts.</p>
       <div class="examples"><button type="button" id="example">${esc(EXAMPLE)}</button></div>`}
    <div class="calls" id="ceo-calls"></div>${reply}</div></section>${plan}`;
  if ($("example")) $("example").onclick = () => { $("input").value = EXAMPLE; $("input").focus(); };
}

function thinking(on) {
  for (const id of ["approve", "send", "input"]) $(id).disabled = on;
  document.querySelector(".thinking")?.remove();
  clearInterval(ceoTimer);
  if (!on) return team();
  team(["ceo_agent"], {ceo_agent: "Planning"});
  document.querySelector(".desk-copy").insertAdjacentHTML("beforeend", `<div class="thinking"><span class="spin"></span>Thinking</div>`);
  ceoTimer = setInterval(showCeoCalls, 700);
}
async function showCeoCalls() {
  const s = await getState();
  data(s);
  if ($("ceo-calls")) $("ceo-calls").innerHTML = s.ceo.map(call).join("");
}

function showReply(r) {
  proposedReply = r;
  const plan = r.plan.map((t, index) => `<article class="panel lane step" style="view-transition-name:task-${index}">
      <header><h3 class="goal">${esc(t.goal)}</h3>${taskAgents(t.agents, t.efforts, [], t.models)}</header>
      <div class="feed plan-details">
        <div class="meta">${icon("target")}<span>Done when ${esc(t.completion_criteria)}</span></div>
        <div class="meta">${icon("deadline")}<span>Due ${esc(t.deadline)}</span></div></div></article>`);
  thinking(false);
  const calls = $("ceo-calls")?.innerHTML ?? "";
  $("bar").hidden = false;
  desk(`<div class="reply">${md(r.text)}</div>`, plan.length ? `<section class="plan"><h2>Proposed plan</h2><div class="lanes">${plan.join("")}</div></section>` : "");
  $("ceo-calls").innerHTML = calls;
  $("approve").hidden = !plan.length;
  $("input").placeholder = plan.length ? "Or say what to change" : "Reply to the CEO agent";
}

$("bar").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  const fresh = !instruction;
  try {
    if (fresh) { instruction = text; desk(); thinking(true); showReply(await post("/instruction", {text})); }
    else {
      thinking(true);
      const r = await post("/answer", {approve: false, text});
      if (!r.approved) return showReply(r);
      thinking(false);                                  // your reply approved the plan: the team starts
      const plan = proposedReply.plan;
      await moveStage(() => working(plan));
      poll();
    }
  } catch (error) {                                     // say what went wrong instead of thinking forever
    thinking(false);
    if (fresh) instruction = "";
    document.querySelector(".desk-copy")?.insertAdjacentHTML("beforeend",
      `<p class="approval-error" role="alert">Something went wrong (${esc(error.message)}). Check the server window, then try again.</p>`);
    $("input").value = text;
  }
};

$("approve").onclick = async () => {
  const reply = proposedReply;
  for (const id of ["approve", "send", "input"]) $(id).disabled = true;
  const moving = moveStage(() => working(reply.plan));
  try {
    await post("/answer", {approve: true});
  } catch {
    await moving;
    showReply(reply);
    document.querySelector(".plan").insertAdjacentHTML("beforeend",
      `<p class="approval-error" role="alert">Couldn’t confirm approval. Reload to check the current task status.</p>`);
    $("approve").disabled = true;
    return;
  }
  await moving;
  poll();
};

function moveStage(render) {
  const update = () => { render(); window.scrollTo(0, 0); };
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    return document.startViewTransition(update).finished;
  }
  update();
}

function workflowSummary(title, symbol, usage = "") {
  return `<section class="workflow-summary ${usage ? "completion-summary" : "panel"}">
    <div class="work-status">${symbol}<div><h1>${esc(title)}</h1>
      ${usage ? `<p class="usage muted">${esc(usage)}</p>` : ""}</div>
      ${usage ? "" : `<span class="counter muted" id="task-count" aria-live="polite"></span>`}</div>
    <div class="muted">${esc(instruction)}</div>
    ${usage ? "" : `<div class="task-progress" id="task-progress" role="progressbar" aria-label="Tasks completed" aria-valuemin="0"></div>`}
    </section>`;
}

function working(plan = []) {
  $("bar").hidden = true;
  team();
  const cards = plan.map((t, index) => `<article class="panel lane" style="view-transition-name:task-${index}" data-goal="${esc(t.goal)}">
    ${lane({...t, status:"open", log:[]})}</article>`);
  $("stage").innerHTML = `${workflowSummary("The team is working", '<span class="spin" aria-hidden="true"></span>')}
    <section class="lanes" id="lanes" aria-label="Tasks">${cards.join("")}</section>`;
  progress(plan.map(taskStatus));
}

const taskStatus = t => t.status === "open" && (t.active_agents?.length || t.log?.length) ? "active" : (t.status || "open");

function progress(statuses) {
  const total = statuses.length;
  const complete = statuses.filter(status => status === "done").length;
  const track = $("task-progress");
  const segments = total || 1;
  track.setAttribute("aria-valuemax", segments);
  track.setAttribute("aria-valuenow", complete);
  if (track.childElementCount !== segments) track.innerHTML = "<span></span>".repeat(segments);
  (total ? statuses : ["open"]).forEach((status, i) => { track.children[i].className = status; });
  const count = total ? `${complete} of ${total} complete` : "";
  if ($("task-count").textContent !== count) $("task-count").textContent = count;
}

function badge(status) {
  const label = status === "active" ? "Working" : status[0].toUpperCase() + status.slice(1);
  return `<span class="badge icon-badge ${esc(status)}">${Object.hasOwn(ICONS, status) ? icon(status) : ""}${esc(label)}</span>`;
}

function taskHeader(t, live = false) {
  const calls = live ? t.log.length : 0;
  const active = live ? t.active_agents || [] : [];
  const actors = active.map(a => esc(agentName(a))).join(", ");
  const turn = actors ? `<p class="turn">${icon("active")}${actors} on turn</p>` : "";
  const status = live ? taskStatus(t) : t.status;
  const heading = t.id && !live
    ? `<h2 class="result-title">Task ${esc(t.id)}</h2><p class="goal">${esc(t.goal)}</p>`
    : `${t.id ? `<div class="task-number">Task ${esc(t.id)}${calls ? ` · ${calls} tool ${calls === 1 ? "call" : "calls"}` : ""}</div>` : ""}
      <h2 class="goal">${esc(t.goal)}</h2>`;
  return `<header><div>${heading}</div>
      ${badge(status)}${taskAgents(t.agents, t.efforts, active, t.models)}${turn}</header>`;
}

function lane(t) {
  const notes = (t.progress || "").trim().split("\n").filter(Boolean)
    .map(p => `<div class="note"><p>${esc(p)}</p></div>`);
  return `${taskHeader(t, true)}
    <div class="feed"><div class="calls">${t.log.map(call).join("") ||
      (t.active_agents?.length ? "" : `<div class="waiting muted">${icon("open")}Waiting to start</div>`)}</div>${notes.join("")}</div>`;
}

function taskTeam(s) {
  const status = {};
  for (const t of s.tasks) {
    for (const a of [...agentIds(t.agents), "coordinator"]) {
      if (t.status === "open" && s.working) status[a] = "Assigned";
      else if (t.status === "done") status[a] ??= "Done";
    }
  }
  const active = s.tasks.flatMap(t => t.active_agents || []);
  for (const a of active) delete status[a];
  team(active, status);
}

async function poll(s = null) {
  s ??= await getState();
  data(s);
  const lanes = $("lanes");
  const placeholders = [...lanes.querySelectorAll("[data-goal]")];
  for (const t of s.tasks) {
    let el = $(`lane-${t.id}`) || placeholders.find(card => card.dataset.goal === t.goal);
    if (!el) {
      el = document.createElement("article");
      el.className = "panel lane";
      el.style.viewTransitionName = `live-task-${t.id}`;
      lanes.append(el);
    }
    el.id = `lane-${t.id}`;
    delete el.dataset.goal;
    const snapshot = JSON.stringify(t);
    if (laneSnapshots.get(el) === snapshot) continue;
    laneSnapshots.set(el, snapshot);
    const feed = el.querySelector(".feed");
    const atEnd = !feed || feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 30;
    const open = new Set([...el.querySelectorAll("details[open]")].map(d => d.dataset.callKey));
    el.innerHTML = lane(t);
    el.querySelectorAll("details").forEach(d => { if (open.has(d.dataset.callKey)) d.open = true; });
    if (atEnd) el.querySelector(".feed").scrollTop = 1e9;
  }
  if (s.tasks.length) {
    for (const card of placeholders) if (!card.id) card.remove();
    const tasksByLane = new Map(s.tasks.map(t => [`lane-${t.id}`, t]));
    progress([...lanes.children].map(card => tasksByLane.get(card.id)).filter(Boolean).map(taskStatus));
  }
  taskTeam(s);
  if (s.working || !s.tasks.length) return setTimeout(poll, 900);
  moveStage(() => done(s.tasks));
}

function done(tasks) {
  const ok = tasks.every(t => t.status === "done");
  const tokens = tasks.reduce((n, t) => n + t.tokens, 0).toLocaleString();
  const usage = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"} used ${tokens} tokens.`;
  const results = tasks.map(t => {
    const name = $(`lane-${t.id}`)?.style.viewTransitionName || `live-task-${t.id}`;
    const outcome = (t.progress || "").trim().split("\n").pop();
    const exception = t.exceptions?.trim();
    const alert = exception ? `<div class="result-alert">${icon("blocked")}
      <div><strong>Needs review</strong><p>${esc(exception)}</p></div></div>` : "";
    const followUp = t.status === "blocked" ? `<button class="follow-up" type="button" data-task-id="${esc(t.id)}"
      aria-label="Ask the CEO agent about Task ${esc(t.id)}">Ask the CEO agent</button>` : "";
    const content = (outcome ? `<p class="muted">${esc(outcome)}</p>` : "") + alert + followUp;
    return `<article class="panel lane result" style="view-transition-name:${name}">
      ${taskHeader(t)}${content ? `<div class="feed">${content}</div>` : ""}</article>`;
  });
  const seal = `<span class="seal ${ok ? "success" : "attention"}" aria-hidden="true">${icon(ok ? "done" : "blocked")}</span>`;
  $("bar").hidden = true;
  $("stage").innerHTML = `${workflowSummary(ok ? "Done" : "Some tasks need you", seal, usage)}
    <section class="lanes results" aria-label="Task results">${results.join("")}</section>
    <div class="completion-footer"><button class="send" id="next">Give the next instruction</button></div>`;
  for (const button of document.querySelectorAll(".follow-up")) {
    button.onclick = () => openInstruction(`Task ${button.dataset.taskId} is blocked. Review its history and propose a plan for any remaining work.`);
  }
  $("next").onclick = async () => { await post("/next", {}); start(); };
}

const BALE = `<svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="24" rx="3" fill="#F7E7BC" stroke="#7A5410" stroke-width="2"/><path d="M18 12v24M30 12v24" stroke="#7A5410" stroke-width="2.5"/></svg>`;
const STATUS = {in_stock: "In the shed", reserved: "Reserved", ordered: "Ordered"};
let lastLots = {};
function data(s) {                                      // the company data, changing as the agents work
  defaultEfforts = s.default_efforts ?? defaultEfforts;
  defaultModels = s.default_models ?? defaultModels;
  const lots = s.stock.sort((a, b) => (a.status === "ordered") - (b.status === "ordered") || a.lot_id.localeCompare(b.lot_id));
  $("stock").innerHTML = lots.map(l => {
    const changed = lastLots[l.lot_id] && lastLots[l.lot_id] !== JSON.stringify(l) || (Object.keys(lastLots).length && !lastLots[l.lot_id]);
    return `<div class="lot ${changed ? "changed" : ""}">${BALE}<b>${esc(l.lot_id)}</b><span class="tonnes">${l.tonnes} t</span>
      <span class="${l.moisture > 13 ? "wet" : "muted"}">${l.moisture}% moisture</span>
      <span class="badge ${l.status}" style="margin:0">${STATUS[l.status] || esc(l.status)}</span>
      ${l.note ? `<div class="note" title="${esc(l.note)}">${esc(l.note)}</div>` : ""}</div>`;
  }).join("");
  lastLots = Object.fromEntries(s.stock.map(l => [l.lot_id, JSON.stringify(l)]));
  $("inbox").innerHTML = s.inbox.map(m =>
    `<div class="mail"><b>${esc(m.sender)}</b><p title="${esc(m.body)}">${esc(m.body)}</p></div>`).join("");
  history(s.history);
}

function history(items) {
  $("history").innerHTML =
    items.length ? items.slice().reverse().map(i => `<p>${esc(i)}</p>`).join("") : `<p class="muted">None yet</p>`;
}

function openInstruction(draft = "") {
  instruction = ""; seenCalls = new Set();
  $("bar").hidden = false;
  $("approve").hidden = true;
  $("input").placeholder = "Tell the CEO agent what needs doing";
  $("input").value = draft;
  for (const id of ["approve", "send", "input"]) $(id).disabled = false;
  $("input").focus();
}

async function start(s = null) {
  openInstruction();
  desk();
  data(s ?? await getState());
  team();
}
async function resume() {                               // after a refresh, pick up where you were
  const s = await getState();
  if (!s.instruction) return start(s);
  instruction = s.instruction;
  data(s);
  if (s.working) { working(); return poll(s); }
  if (s.tasks.length) { taskTeam(s); return done(s.tasks); }
  desk();
  if (s.reply) return showReply(s.reply);
  thinking(true);                                       // the CEO agent is still thinking
  let r;
  while (!(r = (await getState()).reply)) await new Promise(ok => setTimeout(ok, 1000));
  showReply(r);
}
resume();
</script>
</body>

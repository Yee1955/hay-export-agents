<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#6b6a64"/></marker>
  <style>.h{font-size:26px;font-weight:700}.f{font-size:16px;font-family:'DejaVu Sans Mono',monospace}.s{font-size:16.5px}.i{font-size:18px;font-weight:600}</style>
</defs>
<rect width="1400" height="640" fill="#fff"/>
<text x="60" y="64" font-size="30" font-weight="700" fill="#2c2c2a">hay-export-agents</text>
<text x="60" y="98" font-size="18" fill="#5f5e5a">Agents ask. Tools check, then act. Data remembers. Three boxes, three files.</text>

<!-- Agents -->
<rect x="60" y="150" width="380" height="380" rx="18" fill="#EEEDFE" stroke="#7F77DD"/>
<text class="h" x="90" y="196" fill="#3C3489">Agents</text>
<text class="f" x="90" y="224" fill="#534AB7">agents.py · Codex SDK</text>
<rect x="90" y="250" width="320" height="76" rx="12" fill="#fff" stroke="#AFA9EC"/>
<text class="i" x="112" y="282" fill="#3C3489">CEO agent</text>
<text class="s" x="112" y="308" fill="#534AB7">splits the goal into tasks</text>
<rect x="90" y="342" width="320" height="76" rx="12" fill="#fff" stroke="#AFA9EC"/>
<text class="i" x="112" y="374" fill="#3C3489">Procurement agent</text>
<text class="s" x="112" y="400" fill="#534AB7">orders the shortfall</text>
<text class="s" x="90" y="460" fill="#534AB7">Locked down: no shell, apps</text>
<text class="s" x="90" y="484" fill="#534AB7">or files. Tools are the only way in.</text>

<line x1="442" y1="340" x2="518" y2="340" stroke="#6b6a64" stroke-width="2" marker-end="url(#a)"/>
<text class="s" x="452" y="326" fill="#6b6a64">MCP</text>

<!-- Tools + gate -->
<rect x="520" y="150" width="400" height="380" rx="18" fill="#E1F5EE" stroke="#1D9E75"/>
<text class="h" x="550" y="196" fill="#085041">Tools</text>
<text class="f" x="550" y="224" fill="#0F6E56">tools.py · MCP server</text>
<rect x="550" y="250" width="340" height="132" rx="12" fill="#FAECE7" stroke="#D85A30"/>
<text class="i" x="572" y="282" fill="#712B13">Gate: says yes or no</text>
<text class="s" x="572" y="310" fill="#993C1D">only your own tools and task</text>
<text class="s" x="572" y="334" fill="#993C1D">budget left · exactly the shortfall</text>
<text class="s" x="572" y="358" fill="#993C1D">under the $50k authority limit</text>
<text class="s" x="550" y="420" fill="#0F6E56">Then the tool acts: read stock,</text>
<text class="s" x="550" y="444" fill="#0F6E56">place an order, send a note.</text>
<text class="s" x="550" y="484" fill="#0F6E56">A retry returns the same order.</text>

<line x1="922" y1="340" x2="998" y2="340" stroke="#6b6a64" stroke-width="2" marker-end="url(#a)"/>

<!-- Data -->
<rect x="1000" y="150" width="340" height="380" rx="18" fill="#F1EFE8" stroke="#B4B2A9"/>
<text class="h" x="1030" y="196" fill="#2c2c2a">Data</text>
<text class="f" x="1030" y="224" fill="#5f5e5a">data.py · SQLite</text>
<rect x="1030" y="250" width="280" height="76" rx="12" fill="#fff" stroke="#D3D1C7"/>
<text class="i" x="1052" y="282" fill="#2c2c2a">Mock Business Central</text>
<text class="s" x="1052" y="308" fill="#5f5e5a">stock, quotes, orders, inbox</text>
<rect x="1030" y="342" width="280" height="76" rx="12" fill="#fff" stroke="#D3D1C7"/>
<text class="i" x="1052" y="374" fill="#2c2c2a">Audit log</text>
<text class="s" x="1052" y="400" fill="#5f5e5a">every call, yes or no, why</text>
<text class="s" x="1030" y="460" fill="#5f5e5a">Plus skills/ : team know-how,</text>
<text class="s" x="1030" y="484" fill="#5f5e5a">with a version and an owner.</text>

<text x="60" y="590" font-size="16.5" fill="#6b6a64">Run it:  python -m hayagents.data   →   python -m hayagents.agents ceo_agent   →   python -m hayagents.agents procurement_agent</text>
</svg>
